name: CI

on:
  push:
  pull_request:

env:
  NODE_ENV: test
  PORT: 3000
  DB_PORT: 1433
  DB_USER: sa
  DB_PASSWORD: YourStrong!Passw0rd
  DB_NAME: webotp
  MSSQL_SA_PASSWORD: YourStrong!Passw0rd
  JWT_SECRET: ci-only-secret
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  BCRYPT_ROUNDS: 10

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task ci

  integration:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Wait for SQL Server
        run: |
          MSSQL_CONTAINER=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n1)
          for attempt in {1..60}; do
            if docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d master -Q "SELECT 1" -b >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d master -Q "IF DB_ID('webotp') IS NULL CREATE DATABASE webotp" -b
      - run: deno task migration:run
      - name: Run integration test
        run: deno test --allow-all test/integration_test.ts
        env:
          RUN_INTEGRATION_TESTS: "true"
      - name: Start server
        run: |
          deno run --allow-env --allow-net --allow-read src/main.ts > server.log 2>&1 &
          echo $! > server.pid
      - name: Check database health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health | grep -q '"database":"up"'; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
